name: Build

permissions:
  contents: write

concurrency:
  group: cloudstream-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate KKPhim API contract
        run: ./scripts/check-api.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build and test plugin
        run: |
          chmod +x gradlew
          ./gradlew test make makePluginsJson

          output="$RUNNER_TEMP/cloudstream-builds"
          mkdir -p "$output"
          find . -path '*/build/*.cs3' -exec cp {} "$output" \;
          cp build/plugins.json "$output/plugins.json"
          jq --arg url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json" \
            '.pluginLists = [$url]' repo.json > "$output/repo.json"

      - name: Publish builds branch
        run: |
          output="$RUNNER_TEMP/cloudstream-builds"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout --orphan builds
          git rm -rf .
          cp "$output"/* .
          git add ./*.cs3 plugins.json repo.json
          git commit -m "Build $GITHUB_SHA"
          git push --force origin builds
